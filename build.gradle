plugins {
	id 'base'
}

// aggregate every version subproject's jar into the root build/libs folder
def versionProjects = subprojects.findAll { it.name ==~ /\d+\.\d+.*/ }

tasks.named('build') {
	dependsOn versionProjects.collect { "${it.path}:build" }
}

tasks.register('collectJars') {
	dependsOn versionProjects.collect { "${it.path}:build" }

	doLast {
		File outDir = layout.buildDirectory.dir('libs').get().asFile
		outDir.mkdirs()

		versionProjects.each { sp ->
			File libsDir = sp.layout.buildDirectory.dir('libs').get().asFile
			if (!libsDir.exists()) return

			libsDir.eachFile { f ->
				boolean isJar = f.name.endsWith('.jar')
				boolean isAux = f.name.contains('sources') || f.name.contains('-dev') || f.name.contains('javadoc')
				if (isJar && !isAux) {
					java.nio.file.Files.copy(
						f.toPath(),
						outDir.toPath().resolve(f.name),
						java.nio.file.StandardCopyOption.REPLACE_EXISTING
					)
				}
			}
		}
	}
}

tasks.named('build') {
	dependsOn 'collectJars'
}
